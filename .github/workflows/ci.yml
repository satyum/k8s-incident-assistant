name: Incident assistant CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run offline evaluation
        run: python -m eval.run

      - name: Build image without publishing
        run: docker build --tag incident-assistant:ci .
